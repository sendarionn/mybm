<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>mybm</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="viewer.css">
  </head>
  <body class="viewer-body">
    <main id="viewer" class="viewer" hidden>
      <header class="viewer-header">
        <span class="folder-mark" aria-hidden="true">▰</span>
        <div>
          <a class="viewer-home" href="popup.html">mybm</a>
          <h1 id="folder-title" class="editable-title" tabindex="0" title="クリックしてフォルダ名を編集"></h1>
          <input id="folder-title-editor" class="title-editor" type="text" aria-label="フォルダ名" hidden>
          <p id="folder-path" class="folder-path"></p>
        </div>
      </header>

      <section aria-labelledby="description-heading">
        <h2 id="description-heading">説明</h2>
        <div id="description-editor" class="description-editor"></div>
        <p id="save-status" class="save-status" role="status"></p>
      </section>

      <div class="viewer-columns">
        <section aria-labelledby="children-heading">
          <h2 id="children-heading">子フォルダ</h2>
          <div id="child-folders" class="node-list"></div>
        </section>
        <section aria-labelledby="bookmarks-heading">
          <h2 id="bookmarks-heading">所属ブックマーク</h2>
          <div id="child-bookmarks" class="node-list"></div>
        </section>
      </div>

      <section aria-labelledby="links-heading">
        <h2 id="links-heading">Links・被リンク</h2>
        <div id="links" class="links"></div>
      </section>
    </main>
    <div id="viewer-status" class="viewer-status" role="status">読み込み中</div>
    <script type="module" src="dist/viewer.js"></script>
  </body>
</html>
